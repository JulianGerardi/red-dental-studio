name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: produccion
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      # Informe del design system: falla si aparece un color escrito a mano
      # que ya tiene token. No frena el deploy mientras se termina la migración.
      - run: npm run ds:check
        continue-on-error: true

      - run: npx vite build --base=/red-dental-studio/
        env:
          VITE_HASH_ROUTER: 'true'

      # El design system queda en /storybook, junto a la app. Antes se lee el
      # código para armar las recetas (Patterns / Buttons, Fields, Cards…).
      - run: npm run ds:scan
      # La clave de Gemini del Builder (Describe) sale del secreto del repo; sin secreto, el Builder arma sin IA.
      - run: npx storybook build -o dist/storybook
        env:
          VITE_GEMINI_KEY: ${{ secrets.GEMINI_API_KEY }}

      # El commit publicado, para confirmar el deploy; y el link de prueba (/prueba, de deploy-preview.yml), que
      # publicar main borraría.
      - run: echo "main $GITHUB_SHA" > dist/version.txt
      - run: git fetch --depth=1 origin gh-pages && git archive --format=tar FETCH_HEAD prueba | tar -x -C dist || true

      - uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
